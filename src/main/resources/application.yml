server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /dine_in_customer
  forward-headers-strategy: framework

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: scan-dine-customer-service

  datasource:
    customer-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=customers&sslmode=require
      username: ${NEON_DB_USER}
      password: ${NEON_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CustomerHikariPool

    restaurant-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=restaurants&sslmode=require
      username: ${NEON_DB_USER}
      password: ${NEON_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RestaurantHikariPool

    table-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=tables&sslmode=require
      username: ${NEON_DB_USER}
      password: ${NEON_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TableHikariPool

  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:placeholder}
  auth-token: ${TWILIO_AUTH_TOKEN:placeholder}
  from-number: ${TWILIO_FROM_NUMBER:placeholder}

springdoc:
  packages-to-scan: com.example.scan_dineCustomer
