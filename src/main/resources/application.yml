server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /dine_in_customer
  forward-headers-strategy: framework

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: scan-dine-customer-service

  datasource:
    customer-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=customers&sslmode=require
      username: ${NEON_DB_USER:neondb_owner}
      password: ${NEON_DB_PASSWORD:npg_TYXlUefd3ip6}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CustomerHikariPool

    restaurant-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=restaurants&sslmode=require
      username: ${NEON_DB_USER:neondb_owner}
      password: ${NEON_DB_PASSWORD:npg_TYXlUefd3ip6}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RestaurantHikariPool

    table-ds:
      url: jdbc:postgresql://ep-young-hall-aqtvtudo.c-8.us-east-1.aws.neon.tech/neondb?currentSchema=tables&sslmode=require
      username: ${NEON_DB_USER:neondb_owner}
      password: ${NEON_DB_PASSWORD:npg_TYXlUefd3ip6}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TableHikariPool

  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:7f8c9a2b4d6e8f1a3c5b7d9e0f2a4c6e8b1d3f5a7c9e0b2d4f6a8c1e3d5b7f9}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:placeholder}
  auth-token: ${TWILIO_AUTH_TOKEN:placeholder}
  from-number: ${TWILIO_FROM_NUMBER:placeholder}

springdoc:
  packages-to-scan: com.example.scan_dineCustomer,com.jarvis.aiagent
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1/chat/completions
  default-model: meta-llama/llama-3.1-8b-instruct
